<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>방명록 | LSR2222</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js" defer></script>
    <script src="guestbook.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="index.html">LSR<span>2222</span></a>
      <button class="menu" aria-label="메뉴 열기" aria-expanded="false">Menu</button>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">나의 소개</a>
        <a href="projects.html">프로젝트 소개</a>
        <a class="active" href="guestbook.html">방명록</a>
        <a href="blank.html">빈페이지</a>
      </nav>
    </header>

    <main class="guestbook-container">
      <section class="guestbook-header">
        <p class="label">04 / GUESTBOOK</p>
        <h1>방문해 주셔서<br><em>감사합니다.</em></h1>
        <p class="copy">
          따뜻한 인사나 피드백, 나누고 싶은 이야기를 자유롭게 남겨주세요.
        </p>
      </section>

      <!-- 방명록 입력 폼 -->
      <section class="guestbook-form-section">
        <form id="guestbook-form" class="guestbook-form">
          <div class="form-group">
            <label for="nickname">닉네임</label>
            <input
              type="text"
              id="nickname"
              name="nickname"
              maxlength="50"
              placeholder="당신의 닉네임이나 성함을 적어주세요"
              required
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="message">메시지</label>
              <span id="char-counter" class="char-counter">0 / 500</span>
            </div>
            <textarea
              id="message"
              name="message"
              rows="4"
              maxlength="500"
              placeholder="남기실 메시지를 입력해 주세요 (최대 500자)"
              required
            ></textarea>
          </div>

          <div class="form-footer">
            <div id="form-status" class="form-status" role="alert" aria-live="polite"></div>
            <button type="submit" id="submit-btn" class="button button-submit">남기기 <span>↗</span></button>
          </div>
        </form>
      </section>

      <!-- 방명록 목록 -->
      <section class="guestbook-list-section">
        <div class="list-title-row">
          <h2>남겨진 발자국들</h2>
          <button id="refresh-btn" class="refresh-button" aria-label="방명록 새로고침" title="새로고침">
            새로고침 ↻
          </button>
        </div>

        <div id="guestbook-list" class="guestbook-list" aria-live="polite">
          <!-- JS에서 렌더링됨 -->
        </div>
      </section>
    </main>

    <footer>© 2026 LSR2222. All rights reserved.</footer>
  </body>
</html>
