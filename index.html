<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RiverSide Ulsan</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff;
        background: linear-gradient(135deg, #003b5c, #007f87 55%, #63b99b);
      }
      main { padding: 2rem; text-align: center; }
      h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5.5rem); letter-spacing: -0.06em; }
      p { margin: 1rem 0 0; font-size: clamp(1rem, 2vw, 1.3rem); opacity: 0.92; }
    </style>
  </head>
  <body>
    <main>
      <h1>RiverSide Ulsan</h1>
      <p>울산의 새로운 이야기가 곧 시작됩니다.</p>
    </main>
  </body>
</html>
